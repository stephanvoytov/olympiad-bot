<!DOCTYPE html>
<html lang="ru" class="sl-theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Олимпиады</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Design System: Open Props -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.6.18/open-props.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.6.18/normalize.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.6.18/buttons.min.css">
  <!-- Component Library: Shoelace -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/dark.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace-autoloader.js"></script>
  <style>
    /* ========== DESIGN TOKENS — Open Props + Shoelace mapping ========== */
    :root {
      /* Surfaces */
      --bg: #111116;
      --surface-1: #1a1a22;
      --surface-2: #1e1e28;
      --surface-3: #222230;
      --surface-hover: #252536;
      --border: #2a2a36;
      --border-hover: #343448;

      /* Text — alias Open Props naming */
      --text-1: #e5e5ea;
      --text-2: #8e8ea0;
      --text-3: #555566;

      /* Brand */
      --brand: #5b6abf;
      --brand-hover: #4a58a8;
      --brand-bg: rgba(91,106,191,0.15);
      --success: #4ade80;
      --success-bg: rgba(74,222,128,0.12);
      --warning: #facc15;
      --warning-bg: rgba(250,204,21,0.12);
      --orange: #fb923c;
      --orange-bg: rgba(251,146,60,0.12);
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.12);

      /* Open Props aliases for reuse */
      --radius-sm: var(--radius-2);
      --radius-md: var(--radius-3);
      --radius-pill: var(--radius-round);
      --shadow-sm: var(--shadow-2);
      --shadow-md: var(--shadow-3);
      --ease: var(--ease-3);
      --ease-spring: var(--ease-spring-3);

      /* Shoelace theming — map to our tokens */
      --sl-color-primary-600: var(--brand);
      --sl-color-primary-500: #6b7ac8;
      --sl-color-primary-700: var(--brand-hover);
      --sl-color-success-600: var(--success);
      --sl-color-warning-600: var(--warning);
      --sl-color-danger-600: var(--danger);
      --sl-color-neutral-0: var(--surface-1);
      --sl-color-neutral-50: var(--surface-2);
      --sl-color-neutral-100: var(--surface-3);
      --sl-color-neutral-200: var(--border);
      --sl-color-neutral-300: #3a3a4a;
      --sl-color-neutral-600: var(--text-2);
      --sl-color-neutral-700: var(--text-2);
      --sl-color-neutral-800: var(--text-1);
      --sl-color-neutral-900: #f5f5f5;
      --sl-input-background-color: var(--surface-1);
      --sl-input-background-color-hover: var(--surface-1);
      --sl-input-border-color: var(--border);
      --sl-input-border-color-hover: var(--border-hover);
      --sl-input-border-color-focus: var(--brand);
      --sl-input-color: var(--text-1);
      --sl-input-placeholder-color: var(--text-3);
      --sl-input-help-text-color: var(--text-2);
      --sl-input-label-color: var(--text-2);
      --sl-panel-background-color: var(--surface-1);
      --sl-z-index-dialog: 100;
      --sl-z-index-drawer: 100;
      --sl-font-sans: var(--font-sans);
      --sl-font-mono: var(--font-mono);
      --sl-border-radius-medium: var(--radius-sm);
      --sl-border-radius-large: var(--radius-md);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-pill); }
    html { scrollbar-gutter: stable; }
    body {
      font-family: var(--font-sans);
      font-size: var(--font-size-1);
      line-height: var(--font-lineheight-3);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header — Open Props spacing */
    .header {
      padding: var(--size-4) var(--size-3) var(--size-3);
      position: sticky; top: 0; z-index: var(--layer-2);
      background: var(--bg);
      border-bottom: var(--border-size-1) solid var(--border);
    }
    .header h1 {
      font-size: var(--font-size-5);
      font-weight: var(--font-weight-7);
      letter-spacing: var(--font-letterspacing-0);
      line-height: var(--font-lineheight-1);
    }
    .header .subtitle { color: var(--text-2); font-size: var(--font-size-0); margin-top: var(--size-1); }

    /* Stats — Open Props shadow + radius */
    .stats-row {
      display: flex; gap: var(--size-2); padding: var(--size-3) var(--size-3);
      overflow-x: auto; scrollbar-width: none;
    }
    .stats-row::-webkit-scrollbar { display: none; }
    .stat-card {
      background: var(--surface-1); border-radius: var(--radius-sm);
      padding: var(--size-2) var(--size-3); min-width: 68px; text-align: center;
      flex-shrink: 0; border: var(--border-size-1) solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .stat-card .num { font-size: var(--font-size-4); font-weight: var(--font-weight-7); }
    .stat-card .label {
      font-size: var(--font-size-00); color: var(--text-2); margin-top: var(--size-1);
      text-transform: uppercase; letter-spacing: var(--font-letterspacing-2);
    }

    /* Tabs — custom but token-driven */
    .tabs { display: flex; gap: var(--size-1); padding: 0 var(--size-3) var(--size-3); }
    .tab {
      flex: 1; text-align: center; padding: var(--size-2) var(--size-2);
      border-radius: var(--radius-sm); background: var(--surface-1);
      cursor: pointer; font-size: var(--font-size-1); font-weight: var(--font-weight-6);
      border: var(--border-size-1) solid var(--border); color: var(--text-2);
      transition: background 150ms var(--ease), border-color 150ms var(--ease), transform 100ms var(--ease);
      display: inline-flex; align-items: center; justify-content: center; gap: var(--size-1);
    }
    .tab:active { transform: scale(0.97); }
    .tab.active { background: var(--brand); color: white; border-color: var(--brand); box-shadow: var(--shadow-sm); }
    .tab sl-badge { --sl-color-neutral-600: rgba(255,255,255,0.9); }
    .tab.active sl-badge::part(base) { background: rgba(255,255,255,0.2); border-color: transparent; color: white; }

    .content { padding: 0 var(--size-3); }

    /* Shoelace inputs/selects — ensure full width handling */
    sl-input, sl-select { display: block; }
    sl-input::part(base), sl-select::part(combobox) { background: var(--surface-1); }
    .search-bar { margin-bottom: var(--size-3); }
    .search-bar sl-input { --sl-input-border-radius-medium: var(--radius-sm); }

    .catalog-filters { display: flex; gap: var(--size-2); margin-bottom: var(--size-3); flex-direction: column; }
    .filter-row { display: flex; gap: var(--size-2); flex-wrap: wrap; align-items: center; }
    .filter-row sl-select { flex: 1; min-width: 140px; }
    .filter-row sl-select::part(combobox) { font-size: var(--font-size-0); }

    /* Olympiad cards — use Open Props shadow/radius, Shoelace card part */
    .olympiad-card {
      background: var(--surface-1); border-radius: var(--radius-md);
      padding: var(--size-3); margin-bottom: var(--size-2); cursor: pointer;
      border: var(--border-size-1) solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }
    .olympiad-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
    .olympiad-card:active { transform: scale(0.99); }
    .olympiad-card .row1 {
      display: flex; justify-content: space-between; align-items: flex-start; gap: var(--size-2);
    }
    .olympiad-card .row1 > div:first-child { flex: 1; min-width: 0; }
    .olympiad-card .name { font-size: var(--font-size-2); font-weight: var(--font-weight-6); line-height: var(--font-lineheight-2); }
    .olympiad-card .organizer { font-size: var(--font-size-0); color: var(--text-3); margin-top: var(--size-1); }
    .olympiad-card .meta { display: flex; gap: var(--size-1); margin-top: var(--size-2); flex-wrap: wrap; align-items: center; }
    .olympiad-card .deadline-badge {
      display: inline-flex; align-items: center; gap: var(--size-1);
      margin-top: var(--size-2); padding: var(--size-1) var(--size-2); border-radius: var(--radius-sm);
      font-size: var(--font-size-00); font-weight: var(--font-weight-6);
    }
    .deadline-urgent { background: var(--danger-bg); color: var(--danger); }
    .deadline-soon { background: var(--warning-bg); color: var(--warning); }
    .deadline-later { background: var(--success-bg); color: var(--success); }

    /* Shoelace badges — map semantic variants */
    sl-badge[variant="primary"]::part(base) { background: var(--brand); border-color: var(--brand); }
    sl-badge[variant="success"]::part(base) { background: var(--success-bg); color: var(--success); border-color: transparent; }
    sl-badge[variant="warning"]::part(base) { background: var(--orange-bg); color: var(--orange); border-color: transparent; }
    sl-badge[variant="neutral"]::part(base) { background: rgba(142,142,160,0.12); color: var(--text-2); border-color: transparent; }

    sl-tag::part(base) { font-size: var(--font-size-00); }

    .profile-checkbox-row {
      display: flex; align-items: center; gap: var(--size-2);
      padding: var(--size-1) 0; font-size: var(--font-size-0);
    }
    .profile-checkbox-row:hover { background: var(--surface-hover); border-radius: var(--radius-1); }

    .status-indicator {
      display: inline-flex; align-items: center; gap: var(--size-1);
      font-size: var(--font-size-0); font-weight: var(--font-weight-5);
    }
    .status-indicator svg { flex-shrink: 0; }

    .stage-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: var(--size-2) 0; border-bottom: var(--border-size-1) solid var(--border);
      font-size: var(--font-size-0); gap: var(--size-2);
    }
    .stage-item:last-child { border: none; }
    .stage-item .date { color: var(--text-3); font-size: var(--font-size-00); white-space: nowrap; }
    .stage-item .stage-name { display: flex; align-items: center; gap: var(--size-1); flex: 1; min-width: 0; }

    .empty-state { text-align: center; padding: var(--size-8) var(--size-3); color: var(--text-2); }
    .empty-state h3 { font-size: var(--font-size-3); font-weight: var(--font-weight-7); margin-bottom: var(--size-1); color: var(--text-1); }
    .empty-state p { font-size: var(--font-size-0); color: var(--text-3); line-height: var(--font-lineheight-3); }

    .section-title {
      font-size: var(--font-size-00); font-weight: var(--font-weight-7); margin: var(--size-3) 0 var(--size-2);
      text-transform: uppercase; letter-spacing: var(--font-letterspacing-2); color: var(--text-2);
    }

    .status-selector { display: flex; gap: var(--size-1); flex-wrap: wrap; margin: var(--size-2) 0; }
    .status-btn {
      padding: var(--size-1) var(--size-3); border-radius: var(--radius-pill); border: var(--border-size-1) solid var(--border);
      background: var(--surface-1); color: var(--text-2); cursor: pointer;
      font-size: var(--font-size-00); font-weight: var(--font-weight-5); transition: all 150ms var(--ease);
    }
    .status-btn:active { transform: scale(0.96); }
    .status-btn.active { background: var(--brand); border-color: var(--brand); color: white; box-shadow: var(--shadow-sm); }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--size-2); margin: var(--size-2) 0; }
    .info-item { font-size: var(--font-size-0); }
    .info-item .label { color: var(--text-2); font-size: var(--font-size-00); }

    .group-header {
      display: flex; align-items: center; gap: var(--size-2);
      padding: var(--size-2) 0 var(--size-1); margin-top: var(--size-2);
      font-size: var(--font-size-00); font-weight: var(--font-weight-7);
      text-transform: uppercase; letter-spacing: var(--font-letterspacing-2); color: var(--text-2);
      border-bottom: var(--border-size-1) solid var(--border);
    }
    .group-header:first-child { margin-top: 0; }
    .group-header .group-count {
      margin-left: auto; background: var(--surface-hover);
      padding: 1px var(--size-2); border-radius: var(--radius-pill); font-size: var(--font-size-00);
      color: var(--text-2); font-weight: var(--font-weight-6);
    }

    .loading-overlay {
      position: fixed; inset: 0; z-index: var(--layer-5);
      background: rgba(17,17,22,0.8);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: var(--size-2);
    }
    .loading-overlay.show { display: flex; }
    .loading-text { color: var(--text-2); font-size: var(--font-size-0); }

    /* Shoelace dialog/drawer theming */
    sl-dialog::part(panel), sl-drawer::part(panel) {
      background: var(--surface-1);
      border: var(--border-size-1) solid var(--border);
    }
    sl-dialog::part(header), sl-drawer::part(header) { border-bottom: var(--border-size-1) solid var(--border); }
    sl-dialog::part(footer), sl-drawer::part(footer) { border-top: var(--border-size-1) solid var(--border); background: var(--surface-1); }
    sl-dialog::part(title), sl-drawer::part(title) { font-weight: var(--font-weight-7); font-size: var(--font-size-3); }
    sl-dialog::part(close-button), sl-drawer::part(close-button) { color: var(--text-2); }

    /* Drawer as bottom sheet */
    sl-drawer[placement="bottom"]::part(panel) {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      max-height: 85vh;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Олимпиады</h1>
    <p class="subtitle" id="subtitle">Загрузка...</p>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="tabs">
    <button class="tab active" data-tab="my">Мои <sl-badge id="myCount" variant="neutral" pill>0</sl-badge></button>
    <button class="tab" data-tab="catalog">Каталог <sl-badge id="catCount" variant="neutral" pill>0</sl-badge></button>
  </div>

  <div class="content" id="tabContent"></div>

  <div class="loading-overlay" id="loadingOverlay">
    <sl-spinner style="font-size: 28px; --indicator-color: var(--brand); --track-color: var(--border);"></sl-spinner>
    <div class="loading-text" id="loadingText">Загрузка...</div>
  </div>

  <!-- Shoelace: Confirm dialog -->
  <sl-dialog id="confirmDialog" label="Подтверждение" style="--width: 420px;">
    <div id="confirmBody" style="font-size: var(--font-size-1); color: var(--text-2); line-height: var(--font-lineheight-3);"></div>
    <sl-button slot="footer" variant="text" onclick="closeConfirmDialog()">Отмена</sl-button>
    <sl-button slot="footer" variant="danger" id="confirmYesBtn"></sl-button>
  </sl-dialog>

  <!-- Shoelace: Detail drawer (bottom sheet) -->
  <sl-drawer id="detailDrawer" placement="bottom" style="--size: 85vh;" label="Олимпиада">
    <div id="modalBody"></div>
  </sl-drawer>

  <!-- Shoelace: Stage drawer (bottom sheet) -->
  <sl-drawer id="stageDrawer" placement="bottom" style="--size: auto;" label="Добавить этап">
    <div id="stageModalBody">
      <sl-input id="stageNameInput" label="Название этапа" placeholder="Регистрация, Отборочный тур..." clearable></sl-input>
      <div class="info-grid" style="margin-top: var(--size-3);">
        <sl-input id="stageStartInput" label="Дата начала" type="date" help-text="необязательно"></sl-input>
        <sl-input id="stageEndInput" label="Дата окончания" type="date" help-text="необязательно"></sl-input>
      </div>
      <div style="display:flex; gap: var(--size-3); align-items: flex-end; margin-top: var(--size-3);">
        <sl-checkbox id="stageCompletedInput">Завершён</sl-checkbox>
        <sl-input id="stageResultInput" placeholder="Результат (диплом, баллы...)" style="flex:1;" size="small" clearable></sl-input>
      </div>
      <div id="stageError" style="color: var(--danger); font-size: var(--font-size-00); margin-top: var(--size-1); display:none;"></div>
    </div>
    <sl-button slot="footer" variant="text" onclick="closeStageDrawer()">Отмена</sl-button>
    <sl-button slot="footer" variant="primary" onclick="submitStage()">
      <sl-icon slot="prefix" name="check-lg"></sl-icon> Сохранить
    </sl-button>
  </sl-drawer>

  <script>
    // ========== TELEGRAM DETECTION ==========
    var isTelegram = typeof Telegram !== 'undefined' && Telegram.WebApp;
    var initData = '';
    var TELEGRAM_ID = null;
    if (isTelegram) {
      try { initData = Telegram.WebApp.initData || ''; } catch(e) {}
      try { TELEGRAM_ID = Telegram.WebApp.initDataUnsafe?.user?.id; } catch(e) {}
    }

    // ========== GUEST MODE (localStorage) ==========
    var guestId = localStorage.getItem('guest_telegram_id');
    var guestPassword = localStorage.getItem('guest_password');
    var isLoggedIn = !!TELEGRAM_ID || (!!guestId && !!guestPassword);

    const API = '/api';

    let tgUser = null;
    let myOlympiads = [];
    let catalog = [];
    let catalogProfileFilter = '';
    let catalogLevelFilter = '';
    let catalogDirectionFilter = '';
    let catalogUniFilter = '';
    let catalogBenefitsOnly = false;
    let catalogGroupBy = '';
    let currentDetailEntryId = null;

    // ========== SVG ICONS ==========
    const ICONS = {
      planned: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
      registered: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      participating: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      passed_round: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
      won: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>',
      external: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
      calendar: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      delete: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
      plus: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
      check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
      clock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    };

    // ========== HELPERS ==========
    function showLoading(msg) {
      document.getElementById('loadingText').textContent = msg || 'Загрузка...';
      document.getElementById('loadingOverlay').classList.add('show');
    }
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('show');
    }

    function haptic(style) {
      if (!isTelegram) return;
      try { Telegram.WebApp.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
    }

    function hapticNotify(type) {
      if (!isTelegram) return;
      try { Telegram.WebApp.HapticFeedback.notificationOccurred(type || 'success'); } catch(e) {}
    }

    function openConfirm(title, body, btnText, onConfirm) {
      var dlg = document.getElementById('confirmDialog');
      dlg.label = title;
      document.getElementById('confirmBody').textContent = body;
      var btn = document.getElementById('confirmYesBtn');
      btn.textContent = btnText || 'Подтвердить';
      // Remove old handler and set new one
      var newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      newBtn.id = 'confirmYesBtn';
      newBtn.addEventListener('click', function() {
        dlg.hide();
        if (onConfirm) onConfirm();
      });
      dlg.show();
    }

    function closeConfirmDialog() {
      document.getElementById('confirmDialog').hide();
    }

    function bodyScrollLock(lock) {
      // Shoelace drawers/dialogs handle scroll lock themselves; keep for compatibility
      if (lock) { document.body.style.overflow = 'hidden'; }
      else { document.body.style.overflow = ''; }
    }

    function setupGlobalHandlers() {
      // Shoelace dialogs/drawers handle Esc automatically; keep Telegram BackButton logic
      try {
        if (isTelegram) Telegram.WebApp.BackButton.onClick(function() {
          var detailDrawer = document.getElementById('detailDrawer');
          var stageDrawer = document.getElementById('stageDrawer');
          var confirmDlg = document.getElementById('confirmDialog');
          if (confirmDlg && confirmDlg.open) { confirmDlg.hide(); }
          else if (stageDrawer && stageDrawer.open) { stageDrawer.hide(); }
          else if (detailDrawer && detailDrawer.open) { detailDrawer.hide(); }
        });
      } catch(e) {}
    }

    function updateBackButton() {
      if (!isTelegram) return;
      try {
        var anyOpen = (document.getElementById('detailDrawer')?.open || document.getElementById('stageDrawer')?.open || document.getElementById('confirmDialog')?.open);
        if (anyOpen) Telegram.WebApp.BackButton.show();
        else Telegram.WebApp.BackButton.hide();
      } catch(e) {}
    }

    function esc(str) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(str || ''));
      return d.innerHTML;
    }
    function slSanitize(s) { return s ? encodeURIComponent(s) : s; }
    function slDesanitize(s) { return s ? decodeURIComponent(s) : s; }
    function hasBenefit(p, key) {
      if (!p.benefits || p.benefits[key] == null) return false;
      var v = p.benefits[key];
      if (Array.isArray(v)) return v.length > 0;
      return !!v;
    }

    function statusIcon(status) {
      return '<span class="status-indicator" style="color:var(--' + (status === 'won' ? 'success' : status === 'registered' ? 'brand' : status === 'participating' ? 'warning' : status === 'passed_round' ? 'orange' : 'text-2') + ')">' + (ICONS[status] || ICONS.planned) + ' ' + statusLabel(status) + '</span>';
    }

    function statusLabel(s) {
      return { planned: 'Запланировано', registered: 'Зарегистрирован', participating: 'Участвую', passed_round: 'Прошёл этап', won: 'Победа' }[s] || s;
    }

    function authHeaders() {
      var h = {};
      if (initData) { h['X-Telegram-Init-Data'] = initData; }
      else if (guestId && guestPassword) {
        h['X-Telegram-ID'] = guestId;
        h['X-Telegram-Password'] = guestPassword;
      }
      return h;
    }

    // ========== INIT ==========
    if (isTelegram) { try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch(e) {} }

    async function init() {
      setupGlobalHandlers();

      showLoading('Загрузка каталога...');
      try {
        var catResp = await fetch(API + '/olympiads');
        catalog = await catResp.json();
        document.getElementById('catCount').textContent = catalog.length;
      } catch(e) { catalog = []; }

      if (!TELEGRAM_ID && !guestId) {
        hideLoading();
        document.getElementById('subtitle').textContent = 'Каталог олимпиад';
        document.getElementById('myCount').textContent = '—';
        document.querySelector('[data-tab="my"]').style.display = 'none';
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('[data-tab="catalog"]').classList.add('active');
        renderTab('catalog');
        return;
      }

      showLoading('Загрузка...');
      try {
        var resp = await fetch(API + '/user/me', { headers: authHeaders() });
        if (!resp.ok) {
          localStorage.removeItem('guest_telegram_id');
          localStorage.removeItem('guest_password');
          guestId = null; guestPassword = null;
          hideLoading();
          document.getElementById('subtitle').textContent = 'Каталог олимпиад';
          document.querySelector('[data-tab="my"]').style.display = 'none';
          document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
          document.querySelector('[data-tab="catalog"]').classList.add('active');
          renderTab('catalog');
          return;
        }
        tgUser = await resp.json();
        var nameText = tgUser.full_name || tgUser.username || ('ID: ' + tgUser.telegram_id);
        if (!TELEGRAM_ID && guestId) {
          nameText += ' <span style="cursor:pointer;color:var(--text-3);font-size: var(--font-size-00);" onclick="doLogout()">выйти</span>';
        }
        document.getElementById('subtitle').innerHTML = nameText;
        try {
          const h = authHeaders();
          const [myResp, dashResp] = await Promise.all([
            fetch(API + '/my-olympiads', { headers: h }),
            fetch(API + '/dashboard', { headers: h })
          ]);
          myOlympiads = await myResp.json();
          var dash = await dashResp.json();
          document.getElementById('myCount').textContent = myOlympiads.length;
          renderStats(dash);
        } catch(e) { myOlympiads = []; }
        hideLoading();
        renderTab('my');
        if (isTelegram) { try { haptic('light'); } catch(e) {} }
      } catch(e) {
        hideLoading();
        document.getElementById('subtitle').textContent = 'Ошибка загрузки';
      }
    }

    function showLoginForm() {
      document.getElementById('subtitle').textContent = 'Вход на сайт';
      document.getElementById('statsRow').innerHTML = '';
      document.getElementById('tabContent').innerHTML =
        '<div style="max-width:340px;margin: var(--size-6) auto 0;text-align:center">' +
          '<h2 style="font-size: var(--font-size-4);font-weight: var(--font-weight-7);margin-bottom: var(--size-1);">Вход по ID и паролю</h2>' +
          '<p style="color:var(--text-2);font-size: var(--font-size-0);margin-bottom: var(--size-4);line-height: var(--font-lineheight-3);">' +
            'Получите ID и пароль в Telegram-боте.<br>Нажмите <b>/start</b> в боте.' +
          '</p>' +
          '<sl-input id="loginIdInput" label="Telegram ID" placeholder="123456789" type="number" clearable></sl-input>' +
          '<sl-input id="loginPasswordInput" label="Пароль" placeholder="6 цифр" type="password" maxlength="6" clearable style="margin-top: var(--size-3);"></sl-input>' +
          '<sl-button id="loginBtn" variant="primary" style="width:100%;margin-top: var(--size-4);">Войти</sl-button>' +
          '<div id="loginError" style="color:var(--danger);font-size: var(--font-size-0);margin-top: var(--size-2);display:none"></div>' +
        '</div>';
      // Shoelace inputs need upgrade — attach handler after render
      setTimeout(function() {
        var idInput = document.getElementById('loginIdInput');
        var pwdInput = document.getElementById('loginPasswordInput');
        var btn = document.getElementById('loginBtn');
        if (btn) btn.addEventListener('click', doLogin);
        if (pwdInput) pwdInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
        if (idInput) idInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
        if (idInput && idInput.focus) idInput.focus();
      }, 50);
    }

    async function doLogin() {
      var idEl = document.getElementById('loginIdInput');
      var pwdEl = document.getElementById('loginPasswordInput');
      var id = (idEl ? idEl.value : '').trim();
      var pwd = (pwdEl ? pwdEl.value : '').trim();
      var errEl = document.getElementById('loginError');
      if (!id || !pwd) { errEl.textContent = 'Заполните ID и пароль'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      showLoading('Вход...');
      try {
        var resp = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: parseInt(id), password: pwd })
        });
        hideLoading();
        if (!resp.ok) {
          var data = await resp.json().catch(function() { return {}; });
          errEl.textContent = data.detail || 'Неверный ID или пароль';
          errEl.style.display = 'block';
          return;
        }
        guestId = id; guestPassword = pwd;
        localStorage.setItem('guest_telegram_id', id);
        localStorage.setItem('guest_password', pwd);
        isLoggedIn = true;
        init();
      } catch(e) {
        hideLoading();
        errEl.textContent = 'Ошибка сети'; errEl.style.display = 'block';
      }
    }

    function doLogout() {
      localStorage.removeItem('guest_telegram_id');
      localStorage.removeItem('guest_password');
      guestId = null; guestPassword = null; isLoggedIn = false;
      location.reload();
    }

    async function loadData() {
      const h = authHeaders();
      const [myResp, catResp, dashResp] = await Promise.all([
        fetch(API + '/my-olympiads', { headers: h }),
        fetch(API + '/olympiads'),
        fetch(API + '/dashboard', { headers: h })
      ]);
      myOlympiads = await myResp.json();
      catalog = await catResp.json();
      const dash = await dashResp.json();
      document.getElementById('myCount').textContent = myOlympiads.length;
      document.getElementById('catCount').textContent = catalog.length;
      renderStats(dash);
    }

    // ========== STATS ==========
    function renderStats(dash) {
      const row = document.getElementById('statsRow');
      const labels = {
        planned: 'Запланировано', registered: 'Зарегистрирован',
        participating: 'Участвую', passed_round: 'Прошёл', won: 'Победа'
      };
      var html = '<div class="stat-card"><div class="num">' + dash.total + '</div><div class="label">Всего</div></div>';
      for (var key in labels) {
        if (dash.by_status && dash.by_status[key]) {
          html += '<div class="stat-card"><div class="num">' + dash.by_status[key] + '</div><div class="label">' + labels[key] + '</div></div>';
        }
      }
      if (dash.upcoming_events && dash.upcoming_events.length) {
        html += '<div class="stat-card"><div class="num">' + dash.upcoming_events.length + '</div><div class="label">Ближайшие</div></div>';
      }
      row.innerHTML = html;
    }

    // ========== TABS ==========
    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        renderTab(tab.dataset.tab);
      });
    });

    // Also sync with Shoelace drawers: update Telegram BackButton visibility
    document.getElementById('detailDrawer')?.addEventListener('sl-after-show', updateBackButton);
    document.getElementById('detailDrawer')?.addEventListener('sl-after-hide', updateBackButton);
    document.getElementById('stageDrawer')?.addEventListener('sl-after-show', updateBackButton);
    document.getElementById('stageDrawer')?.addEventListener('sl-after-hide', updateBackButton);
    document.getElementById('confirmDialog')?.addEventListener('sl-after-show', updateBackButton);
    document.getElementById('confirmDialog')?.addEventListener('sl-after-hide', updateBackButton);

    function renderTab(tab) {
      if (tab === 'my') renderMyOlympiads();
      else renderCatalogContent();
    }

    // ========== CATALOG ==========
    function renderCatalogContent(profileFilter) {
      if (profileFilter !== undefined) catalogProfileFilter = profileFilter;
      const container = document.getElementById('tabContent');
      container.innerHTML =
        '<div class="search-bar"><sl-input id="searchInput" placeholder="Поиск по названию..." clearable size="medium"><sl-icon slot="prefix" name="search"></sl-icon></sl-input></div>' +
        (isLoggedIn ? '' : '<sl-card style="margin-bottom: var(--size-3); --padding: var(--size-3);"><div style="display:flex;align-items:center;gap: var(--size-3);"><div style="flex:1"><div style="font-size: var(--font-size-1);font-weight: var(--font-weight-6);">Хотите добавлять олимпиады?</div><div style="font-size: var(--font-size-00);color:var(--text-2);margin-top:2px">Войдите через Telegram-бот</div></div><sl-button variant="primary" size="small" id="loginPromptBtn">Войти</sl-button></div></sl-card>') +
        '<div id="catalogResults"></div>' +
        '<div id="catalogTabFooter" style="display:none;padding: var(--size-3) 0 var(--size-4);position:sticky;bottom:0;background: linear-gradient(180deg, transparent 0%, var(--bg) 40%);"><sl-button variant="primary" style="width:100%;" id="addSelectedBtn">Добавить выбранные</sl-button></div>';
      // Attach shoelace search handler
      setTimeout(function() {
        var searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('sl-input', debouncedSearch);
          searchInput.addEventListener('sl-clear', function() { renderCatalogResults(); });
        }
        var loginPromptBtn = document.getElementById('loginPromptBtn');
        if (loginPromptBtn) loginPromptBtn.addEventListener('click', showLoginForm);
        var addSelectedBtn = document.getElementById('addSelectedBtn');
        if (addSelectedBtn) addSelectedBtn.addEventListener('click', addSelectedFromCatalog);
      }, 50);
      renderCatalogFilter();
      renderCatalogResults();
    }

    function renderCatalogFilter() {
      const container = document.getElementById('tabContent');
      if (!container) return;

      var directions = new Set();
      var unis = new Set();
      catalog.forEach(function(o) {
        (o.tags || []).forEach(function(t) { directions.add(t); });
        (o.universities || []).forEach(function(u) { unis.add(u); });
      });
      var dirList = Array.from(directions).sort();
      var uniList = Array.from(unis).sort();

      var profiles = new Set();
      catalog.forEach(function(o) { (o.profiles || []).forEach(function(p) { profiles.add(p.name); }); });
      var profileList = Array.from(profiles).sort();

      var levelOptions = ['', 1, 2, 3];
      var groupOptions = [
        { val: '', label: 'Без группировки' },
        { val: 'direction', label: 'По направлению' },
        { val: 'university', label: 'По вузу' },
        { val: 'level', label: 'По уровню' },
        { val: 'benefits', label: 'По льготам' },
      ];

      var filterHtml =
        '<div class="catalog-filters" id="catalogFilters">' +
          '<div class="filter-row">' +
            '<sl-select id="directionSelect" placeholder="Все направления" clearable size="small">' +
              '<sl-option value="">Все направления</sl-option>' +
              dirList.map(function(d) { return '<sl-option value="' + slSanitize(d) + '">' + esc(d) + '</sl-option>'; }).join('') +
            '</sl-select>' +
            '<sl-select id="uniSelect" placeholder="Все вузы" clearable size="small">' +
              '<sl-option value="">Все вузы</sl-option>' +
              uniList.map(function(u) { return '<sl-option value="' + slSanitize(u) + '">' + esc(u) + '</sl-option>'; }).join('') +
            '</sl-select>' +
          '</div>' +
          '<div class="filter-row">' +
            '<sl-select id="profileSelect" placeholder="Все профили" clearable size="small">' +
              '<sl-option value="">Все профили</sl-option>' +
              profileList.map(function(p) { return '<sl-option value="' + slSanitize(p) + '">' + esc(p) + '</sl-option>'; }).join('') +
            '</sl-select>' +
            '<sl-select id="levelSelect" placeholder="Любой уровень" clearable size="small">' +
              levelOptions.map(function(l) { return '<sl-option value="' + l + '">' + (l ? 'Ур. ' + l : 'Любой уровень') + '</sl-option>'; }).join('') +
            '</sl-select>' +
          '</div>' +
          '<div class="filter-row">' +
            '<sl-button id="benefitsChip" size="small" pill variant="' + (catalogBenefitsOnly ? 'primary' : 'neutral') + '">' + (catalogBenefitsOnly ? '✓ ' : '') + 'Только с льготами</sl-button>' +
            '<sl-select id="groupSelect" placeholder="Без группировки" size="small" style="flex:1; max-width: 200px;">' +
              groupOptions.map(function(g) { return '<sl-option value="' + g.val + '">' + g.label + '</sl-option>'; }).join('') +
            '</sl-select>' +
          '</div>' +
        '</div>';

      var searchBar = container.querySelector('.search-bar');
      if (searchBar) {
        var existing = container.querySelector('#catalogFilters');
        if (existing) existing.remove();
        searchBar.insertAdjacentHTML('afterend', filterHtml);
        // Restore values and attach shoelace listeners (values are URI-encoded to avoid space restriction)
        setTimeout(function() {
          var dirSel = document.getElementById('directionSelect');
          var uniSel = document.getElementById('uniSelect');
          var profSel = document.getElementById('profileSelect');
          var lvlSel = document.getElementById('levelSelect');
          var grpSel = document.getElementById('groupSelect');
          var benChip = document.getElementById('benefitsChip');
          if (dirSel) { dirSel.value = slSanitize(catalogDirectionFilter); dirSel.addEventListener('sl-change', function() { filterCatalogDirection(slDesanitize(this.value)); }); dirSel.addEventListener('sl-clear', function() { filterCatalogDirection(''); }); }
          if (uniSel) { uniSel.value = slSanitize(catalogUniFilter); uniSel.addEventListener('sl-change', function() { filterCatalogUni(slDesanitize(this.value)); }); uniSel.addEventListener('sl-clear', function() { filterCatalogUni(''); }); }
          if (profSel) { profSel.value = slSanitize(catalogProfileFilter); profSel.addEventListener('sl-change', function() { filterCatalogProfile(slDesanitize(this.value)); }); profSel.addEventListener('sl-clear', function() { filterCatalogProfile(''); }); }
          if (lvlSel) { lvlSel.value = catalogLevelFilter; lvlSel.addEventListener('sl-change', function() { filterCatalogLevel(this.value); }); lvlSel.addEventListener('sl-clear', function() { filterCatalogLevel(''); }); }
          if (grpSel) { grpSel.value = catalogGroupBy; grpSel.addEventListener('sl-change', function() { filterCatalogGroup(this.value); }); }
          if (benChip) benChip.addEventListener('click', toggleBenefitsOnly);
        }, 50);
      }
    }

    function filterCatalogProfile(profile) { catalogProfileFilter = profile; renderCatalogFilter(); renderCatalogResults(); }
    function filterCatalogDirection(dir) { catalogDirectionFilter = dir; renderCatalogFilter(); renderCatalogResults(); }
    function filterCatalogUni(uni) { catalogUniFilter = uni; renderCatalogFilter(); renderCatalogResults(); }
    function filterCatalogLevel(level) { catalogLevelFilter = level; renderCatalogFilter(); renderCatalogResults(); }
    function filterCatalogGroup(val) { catalogGroupBy = val; renderCatalogFilter(); renderCatalogResults(); }
    function toggleBenefitsOnly() { catalogBenefitsOnly = !catalogBenefitsOnly; renderCatalogFilter(); renderCatalogResults(); }

    function profileMatchesFilter(profiles, filter) {
      if (!filter) return true;
      filter = filter.toLowerCase();
      return profiles.some(function(p) { return p.name.toLowerCase().indexOf(filter) !== -1 || p.slug.toLowerCase().indexOf(filter) !== -1; });
    }

    function getOlympiadGroups(items) {
      if (!catalogGroupBy) return null;
      var groups = {};
      var order = [];

      items.forEach(function(o) {
        var key = '';
        if (catalogGroupBy === 'direction') {
          key = (o.tags && o.tags.length) ? o.tags[0] : 'Без направления';
        } else if (catalogGroupBy === 'university') {
          key = (o.universities && o.universities.length) ? o.universities[0] : 'Без вуза';
        } else if (catalogGroupBy === 'level') {
          var lvls = new Set();
          (o.profiles || []).forEach(function(p) { if (p.level) lvls.add('Уровень ' + p.level); });
          key = lvls.size ? Array.from(lvls).sort()[0] : 'Без уровня';
        } else if (catalogGroupBy === 'benefits') {
          var hasBvi = (o.profiles || []).some(function(p) { return hasBenefit(p, 'БВИ'); });
          var has100 = (o.profiles || []).some(function(p) { return hasBenefit(p, '100_баллов'); });
          if (hasBvi) key = 'БВИ';
          else if (has100) key = '100 баллов';
          else key = 'Без льгот';
        }
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(o);
      });

      // Sort group order for benefits: БВИ first
      if (catalogGroupBy === 'benefits') {
        order.sort(function(a, b) {
          if (a === 'БВИ') return -1;
          if (b === 'БВИ') return 1;
          if (a === '100 баллов') return -1;
          if (b === '100 баллов') return 1;
          return 0;
        });
      }

      return { groups: groups, order: order };
    }

    function renderOlympiadCard(o) {
      var allProfiles = o.profiles || [];
      var hasBvi = allProfiles.some(function(p) { return hasBenefit(p, 'БВИ'); });
      var has100 = allProfiles.some(function(p) { return hasBenefit(p, '100_баллов'); });
      var levels = [...new Set(allProfiles.map(function(p) { return p.level; }).filter(Boolean))].sort().join(', ');
      var profHtml = '<div class="profiles-list" style="margin-top: var(--size-2);">';
      allProfiles.forEach(function(p) {
        var levelBadge = p.level ? '<sl-badge variant="primary" pill>Ур. ' + p.level + '</sl-badge>' : '';
        var bviBadge = hasBenefit(p, 'БВИ') ? '<sl-badge variant="success" pill>БВИ</sl-badge>' : '';
        var ptsBadge = hasBenefit(p, '100_баллов') ? '<sl-badge variant="warning" pill>100</sl-badge>' : '';
        profHtml += '<label class="profile-checkbox-row">' +
          '<input type="checkbox" class="profile-chk" data-oid="' + esc(o.id) + '" data-slug="' + esc(p.slug) + '" style="accent-color: var(--brand); width: 16px; height: 16px; flex-shrink:0;"> ' +
          '<span style="flex:1; min-width:0;">' + esc(p.name) + '</span> ' + levelBadge + ' ' + bviBadge + ' ' + ptsBadge +
          '</label>';
      });
      profHtml += '</div>';

      var deadlineHtml = '';
      var now = Date.now();
      var nearestDeadline = null;
      allProfiles.forEach(function(p) {
        (p.stages || []).forEach(function(s) {
          if (s.date_end) {
            var ts = new Date(s.date_end).getTime();
            if (ts > now && (!nearestDeadline || ts < nearestDeadline.ts)) {
              nearestDeadline = { ts: ts, name: s.name, date: s.date_end };
            }
          }
        });
      });
      if (nearestDeadline) {
        var days = Math.ceil((nearestDeadline.ts - now) / (1000*60*60*24));
        var cls = days <= 7 ? 'deadline-urgent' : days <= 30 ? 'deadline-soon' : 'deadline-later';
        deadlineHtml = '<div class="deadline-badge ' + cls + '">' +
          ICONS.clock + ' ' + esc(nearestDeadline.name) + ': ' + formatDate(nearestDeadline.date) +
          ' (' + days + ' дн.)</div>';
      }

      return '<div class="olympiad-card" style="cursor:default">' +
        '<div class="row1"><div><div class="name">' + esc(o.name) + '</div><div class="organizer">' + esc(o.organizer || '') + '</div>' +
        (o.universities && o.universities.length ? '<div style="margin-top: var(--size-1);display:flex;flex-wrap:wrap;gap: var(--size-1);">' + o.universities.map(function(u) { return '<sl-tag size="small" variant="neutral" pill>' + esc(u) + '</sl-tag>'; }).join('') + '</div>' : '') +
        '</div>' +
        (levels ? '<div><sl-badge variant="primary" pill>Ур. ' + esc(levels) + '</sl-badge></div>' : '') + '</div>' +
        (hasBvi || has100 ? '<div class="meta">' + (hasBvi ? '<sl-badge variant="success" pill>БВИ</sl-badge>' : '') + (has100 ? '<sl-badge variant="warning" pill>100 баллов</sl-badge>' : '') + '</div>' : '') +
        (o.url || o.registration_url ? '<div style="display:flex;gap: var(--size-2);flex-wrap:wrap;margin-top: var(--size-1);">' +
          (o.url ? '<a href="' + esc(o.url) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;color:var(--brand);text-decoration:none;font-size: var(--font-size-0);font-weight: var(--font-weight-5);">' + ICONS.external + ' Сайт</a>' : '') +
          (o.registration_url ? '<a href="' + esc(o.registration_url) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;color:var(--brand);text-decoration:none;font-size: var(--font-size-0);font-weight: var(--font-weight-5);">' + ICONS.external + ' Регистрация</a>' : '') +
        '</div>' : '') +
        deadlineHtml + profHtml + '</div>';
    }

    function renderCatalogResults() {
      const el = document.getElementById('catalogResults');
      if (!el) return;
      var q = '';
      var inp = document.getElementById('searchInput');
      if (inp) q = (inp.value || '').toLowerCase();

      var items = catalog.slice();
      if (catalogDirectionFilter) {
        var dirLower = catalogDirectionFilter.toLowerCase();
        items = items.filter(function(o) { return (o.tags || []).some(function(t) { return t.toLowerCase() === dirLower; }); });
        // Filter profiles to only show matching direction
        items = items.map(function(o) {
          var filteredProfiles = (o.profiles || []).filter(function(p) {
            return (p.name || '').toLowerCase().indexOf(dirLower) !== -1;
          });
          if (filteredProfiles.length === 0) filteredProfiles = o.profiles || [];
          return Object.assign({}, o, { profiles: filteredProfiles });
        });
      }
      if (catalogUniFilter) {
        var uniLower = catalogUniFilter.toLowerCase();
        items = items.filter(function(o) { return (o.universities || []).some(function(u) { return u.toLowerCase() === uniLower; }); });
      }
      if (catalogProfileFilter) {
        var profLower = catalogProfileFilter.toLowerCase();
        items = items.filter(function(o) { return (o.profiles || []).some(function(p) { return (p.name || '').toLowerCase().indexOf(profLower) !== -1; }); });
        // Also filter profiles to only matching
        items = items.map(function(o) {
          var filteredProfiles = (o.profiles || []).filter(function(p) {
            return (p.name || '').toLowerCase().indexOf(profLower) !== -1;
          });
          if (filteredProfiles.length === 0) filteredProfiles = o.profiles || [];
          return Object.assign({}, o, { profiles: filteredProfiles });
        });
      }
      if (catalogLevelFilter) {
        var lv = parseInt(catalogLevelFilter);
        items = items.filter(function(o) {
          return (o.profiles || []).some(function(p) { return p.level === lv; });
        });
        // Filter profiles to only matching level
        items = items.map(function(o) {
          var filteredProfiles = (o.profiles || []).filter(function(p) { return p.level === lv; });
          if (filteredProfiles.length === 0) filteredProfiles = o.profiles || [];
          return Object.assign({}, o, { profiles: filteredProfiles });
        });
      }
      if (catalogBenefitsOnly) {
        items = items.filter(function(o) {
          return (o.profiles || []).some(function(p) { return hasBenefit(p, 'БВИ') || hasBenefit(p, '100_баллов'); });
        });
        // Filter profiles to only those with benefits
        items = items.map(function(o) {
          var filteredProfiles = (o.profiles || []).filter(function(p) { return hasBenefit(p, 'БВИ') || hasBenefit(p, '100_баллов'); });
          if (filteredProfiles.length === 0) filteredProfiles = o.profiles || [];
          return Object.assign({}, o, { profiles: filteredProfiles });
        });
      }
      if (q) {
        items = items.filter(function(o) {
          var name = (o.name || '').toLowerCase();
          var org = (o.organizer || '').toLowerCase();
          var tags = (o.tags || []).join(' ').toLowerCase();
          var unis = (o.universities || []).join(' ').toLowerCase();
          return name.indexOf(q) !== -1 || org.indexOf(q) !== -1 || tags.indexOf(q) !== -1 || unis.indexOf(q) !== -1;
        });
      }

      // Sort: БВИ first, then 100, then by level desc, then by name
      items.sort(function(a, b) {
        var aHasBvi = (a.profiles || []).some(function(p) { return hasBenefit(p, 'БВИ'); });
        var bHasBvi = (b.profiles || []).some(function(p) { return hasBenefit(p, 'БВИ'); });
        if (aHasBvi !== bHasBvi) return bHasBvi - aHasBvi;
        var aHas100 = (a.profiles || []).some(function(p) { return hasBenefit(p, '100_баллов'); });
        var bHas100 = (b.profiles || []).some(function(p) { return hasBenefit(p, '100_баллов'); });
        if (aHas100 !== bHas100) return bHas100 - aHas100;
        var aMaxLv = Math.max.apply(null, (a.profiles || []).map(function(p) { return p.level || 0; }).concat([0]));
        var bMaxLv = Math.max.apply(null, (b.profiles || []).map(function(p) { return p.level || 0; }).concat([0]));
        if (aMaxLv !== bMaxLv) return bMaxLv - aMaxLv;
        return a.name.localeCompare(b.name);
      });

      if (!items.length) {
        el.innerHTML = '<div class="empty-state"><h3>Ничего не найдено</h3></div>';
        return;
      }

      var result = getOlympiadGroups(items);
      if (!result) {
        el.innerHTML = items.map(function(o) { return renderOlympiadCard(o); }).join('');
      } else {
        var html = '';
        result.order.forEach(function(groupName) {
          var groupItems = result.groups[groupName];
          // Sort within group: БВИ first, then 100, then level desc, then name
          groupItems.sort(function(a, b) {
            var aBvi = (a.profiles || []).some(function(p) { return hasBenefit(p, 'БВИ'); });
            var bBvi = (b.profiles || []).some(function(p) { return hasBenefit(p, 'БВИ'); });
            if (aBvi !== bBvi) return bBvi - aBvi;
            var a100 = (a.profiles || []).some(function(p) { return hasBenefit(p, '100_баллов'); });
            var b100 = (b.profiles || []).some(function(p) { return hasBenefit(p, '100_баллов'); });
            if (a100 !== b100) return b100 - a100;
            var aLv = Math.max.apply(null, (a.profiles || []).map(function(p) { return p.level || 0; }).concat([0]));
            var bLv = Math.max.apply(null, (b.profiles || []).map(function(p) { return p.level || 0; }).concat([0]));
            if (aLv !== bLv) return bLv - aLv;
            return a.name.localeCompare(b.name);
          });
          html += '<div class="group-header">' +
            '<span>' + esc(groupName) + '</span>' +
            '<span class="group-count">' + groupItems.length + '</span>' +
            '</div>';
          groupItems.forEach(function(o) { html += renderOlympiadCard(o); });
        });
        el.innerHTML = html;
      }
    }

    async function batchAddProfiles(elements) {
      var ids = [];
      elements.forEach(function(cb) {
        ids.push({ oid: cb.getAttribute('data-oid'), slug: cb.getAttribute('data-slug') });
      });
      if (ids.length === 0) return;
      haptic('medium');
      var ok = 0, fail = 0;
      for (var i = 0; i < ids.length; i++) {
        try {
          const h = authHeaders();
          h['Content-Type'] = 'application/json';
          const resp = await fetch(API + '/my-olympiads/add', {
            method: 'POST', headers: h,
            body: JSON.stringify({ olympiad_id: ids[i].oid, profile_slug: ids[i].slug })
          });
          if (resp.ok) ok++; else fail++;
        } catch(e) { fail++; }
      }
      showToast(fail === 0 ? 'Добавлено: ' + ok : 'Добавлено: ' + ok + ', ошибок: ' + fail, fail === 0 ? 'success' : 'warning');
      hapticNotify(fail === 0 ? 'success' : 'warning');
      await loadData();
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelector('[data-tab="my"]').classList.add('active');
      renderTab('my');
    }

    async function addSelectedFromCatalog() {
      var checked = document.querySelectorAll('#catalogResults .profile-chk:checked');
      if (checked.length === 0) { showToast('Выберите хотя бы один профиль', 'warning'); return; }

    // ========== MY OLYMPIADS ==========
    function renderMyOlympiads() {
      var container = document.getElementById('tabContent');
      if (!myOlympiads.length) {
        container.innerHTML =
          '<div class="empty-state"><h3>Нет добавленных олимпиад</h3><p>Откройте «Каталог», выберите профили и нажмите «Добавить выбранные»</p></div>';
        return;
      }

      var order = { won: 0, passed_round: 1, registered: 2, participating: 3, planned: 4 };
      var sorted = myOlympiads.slice().sort(function(a, b) {
        var statusDiff = (order[a.status] || 99) - (order[b.status] || 99);
        if (statusDiff !== 0) return statusDiff;
        var nextA = findNextStage(a.stages);
        var nextB = findNextStage(b.stages);
        var dateA = nextA ? new Date(nextA.date_start || nextA.date_end || 0).getTime() : 9999999999999;
        var dateB = nextB ? new Date(nextB.date_start || nextB.date_end || 0).getTime() : 9999999999999;
        return dateA - dateB;
      });

container.innerHTML = sorted.map(function(o) {
          var nextStage = findNextStage(o.stages);
          var daysLeft = nextStage && nextStage.date_end ? daysUntil(nextStage.date_end) : null;
          return '<div class="olympiad-card" onclick="openDetail(' + o.id + ')">' +
            '<div class="row1"><div><div class="name">' + statusIcon(o.status) + ' ' + esc(o.name) + '</div>' +
            (o.profile_name ? '<div class="organizer">' + esc(o.profile_name) + '</div>' : '') +
            '<div class="organizer">' + esc(o.organizer || '') + '</div></div>' +
            '<div>' + (o.level ? '<sl-badge variant="primary" pill>Ур. ' + esc(o.level) + '</sl-badge>' : '') + '</div></div>' +
            '<div class="meta">' + renderBenefitBadges(o.benefits) + '</div>' +
            (nextStage ? renderNextStageInfo(nextStage, daysLeft) : '') +
            (o.url || o.registration_url ? '<div style="display:flex;gap: var(--size-2);flex-wrap:wrap;margin-top: var(--size-1);">' +
              (o.url ? '<a href="' + esc(o.url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:4px;color:var(--brand);text-decoration:none;font-size: var(--font-size-0);font-weight: var(--font-weight-5);">' + ICONS.external + ' Сайт</a>' : '') +
              (o.registration_url ? '<a href="' + esc(o.registration_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:4px;color:var(--brand);text-decoration:none;font-size: var(--font-size-0);font-weight: var(--font-weight-5);">' + ICONS.external + ' Регистрация</a>' : '') +
            '</div>' : '') +
            '</div>';
        }).join('');
    }

    function findNextStage(stages) {
      var upcoming = stages.filter(function(s) { return !s.is_completed && (s.date_start || s.date_end); });
      if (!upcoming.length) return null;
      return upcoming.sort(function(a, b) {
        var da = new Date(a.date_start || a.date_end || 0).getTime();
        var db = new Date(b.date_start || b.date_end || 0).getTime();
        return da - db;
      })[0];
    }

    function renderNextStageInfo(stage, daysLeft) {
      var dateStr = formatDate(stage.date_start || stage.date_end);
      var cls = 'deadline-later';
      var urgency = '';
      if (daysLeft !== null) {
        if (daysLeft < 0) { cls = 'deadline-urgent'; urgency = 'Просрочено'; }
        else if (daysLeft <= 7) { cls = 'deadline-urgent'; urgency = daysLeft + ' дн.'; }
        else if (daysLeft <= 30) { cls = 'deadline-soon'; urgency = daysLeft + ' дн.'; }
      }
      return '<div class="deadline-badge ' + cls + '">' + ICONS.clock + ' ' + esc(stage.name) + ': ' + dateStr + (urgency ? ' (' + urgency + ')' : '') + '</div>';
    }

          else daysStr = '<span style="color:var(--text-2);font-size: var(--font-size-00);">' + days + ' дн.</span>';
        }
        return '<div class="stage-item">' +
          '<div class="stage-name">' +
          '<span style="color:' + (s.is_completed ? 'var(--success)' : 'var(--warning)') + '">' + (s.is_completed ? ICONS.check : ICONS.clock) + '</span>' +
          esc(s.name) + (s.result ? ' <span style="color:var(--success);font-size: var(--font-size-00);">(' + esc(s.result) + ')</span>' : '') +

          '<div style="text-align:right;display:flex;align-items:center;gap: var(--size-1);">' +

      document.getElementById('modalBody').innerHTML =

        (o.level ? '<sl-badge variant="primary" pill>Ур. ' + esc(o.level) + '</sl-badge>' : '') +
        (o.profile_name ? '<sl-tag size="small" pill>' + esc(o.profile_name) + '</sl-tag>' : '') +
        renderBenefitBadges(o.benefits) + '</div>' +
        '<div style="font-size: var(--font-size-00);color:var(--text-3);margin-bottom: var(--size-1);">' + esc(o.organizer || '') + '</div>' +
        (o.url || o.registration_url ? '<div style="display:flex;gap: var(--size-2);flex-wrap:wrap;margin-bottom: var(--size-2);">' +
          (o.url ? '<a href="' + esc(o.url) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;color:var(--brand);text-decoration:none;font-size: var(--font-size-0);font-weight: var(--font-weight-5);">' + ICONS.external + ' Сайт</a>' : '') +
          (o.registration_url ? '<a href="' + esc(o.registration_url) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;color:var(--brand);text-decoration:none;font-size: var(--font-size-0);font-weight: var(--font-weight-5);">' + ICONS.external + ' Регистрация</a>' : '') +
        '</div>' : '') +
        '<div class="section-title">Статус</div><div class="status-selector">' +
        ['planned','registered','participating','passed_round','won'].map(function(key) {
          return '<button class="status-btn ' + (o.status === key ? 'active' : '') + '" onclick="updateStatus(' + o.id + ", '" + key + "')" + '">' + statusLabel(key) + '</button>';
        }).join('') + '</div>' +
        '<div class="section-title">Этапы</div>' +
        '<div style="margin: var(--size-1) 0 var(--size-2);"><sl-button size="small" variant="default" onclick="openStageDrawer(' + o.id + ')"><sl-icon slot="prefix" name="plus-lg"></sl-icon> Добавить этап</sl-button></div>' +
        (stagesHtml || '<div style="color:var(--text-2);font-size: var(--font-size-0);">Нет этапов</div>') +
        '<div style="margin-top: var(--size-4);display:flex;gap: var(--size-2);flex-wrap:wrap;">' +
        '<sl-button size="small" variant="primary" onclick="syncToCalendar(' + o.id + ')"><sl-icon slot="prefix" name="calendar-event"></sl-icon> Календарь</sl-button>' +
        '<sl-button size="small" variant="danger" outline onclick="deleteOlympiad(' + o.id + ')"><sl-icon slot="prefix" name="trash"></sl-icon> Удалить</sl-button></div>';
      drawer.show();
      updateBackButton();
    }

    function openEditStageDrawer(entryId, stageId) {

    async function submitStage() {
      var nameEl = document.getElementById('stageNameInput');
      var name = (nameEl ? nameEl.value : '').trim();
      if (!name) { showToast('Введите название этапа', 'warning'); return; }
      var startEl = document.getElementById('stageStartInput');
      var endEl = document.getElementById('stageEndInput');
      var start = (startEl ? startEl.value : '') || null;
      var end = (endEl ? endEl.value : '') || null;
      var sc = document.getElementById('stageCompletedInput');
      var isCompleted = sc ? sc.checked : false;
      var srEl = document.getElementById('stageResultInput');
      var result = (srEl ? srEl.value : '').trim() || null;

      if (start && end && start > end) { showToast('Дата начала не может быть позже даты окончания', 'warning'); return; }

      var editStageId = sc ? sc.dataset.editStageId : undefined;
      var editEntryId = sc ? sc.dataset.editEntryId : undefined;
      var isEdit = editStageId !== undefined && editStageId !== '';

      try {
        const h = authHeaders();
        h['Content-Type'] = 'application/json';
        var body = { name: name, date_start: start, date_end: end, is_completed: isCompleted, result: result };

        if (isEdit) {
          await fetch(API + '/my-olympiads/' + editEntryId + '/stage/' + editStageId, {
            method: 'PATCH', headers: h, body: JSON.stringify(body)
          });
          showToast('Этап обновлён', 'success');
        } else {
          await fetch(API + '/my-olympiads/' + currentDetailEntryId + '/stage', {
            method: 'POST', headers: h, body: JSON.stringify(body)
          });
          showToast('Этап добавлен', 'success');
        }
        if (sc) { delete sc.dataset.editStageId; delete sc.dataset.editEntryId; }
        closeStageDrawer();
        await loadData();
        openDetail(currentDetailEntryId);
        hapticNotify('success');
      } catch(e) { showToast('Ошибка при сохранении этапа', 'danger'); }
    }

    function benefitHas(obj, key) {
      if (!obj || obj[key] == null) return false;
      var v = obj[key];
      if (Array.isArray(v)) return v.length > 0;
      return !!v;
    }

    // ========== UTILS ==========
    function renderBenefitBadges(benefits) {
      if (!benefits) return '';
      var html = '';
      if (benefitHas(benefits, 'БВИ')) html += '<sl-badge variant="success" pill>БВИ</sl-badge> ';
      if (benefitHas(benefits, '100_баллов')) html += '<sl-badge variant="warning" pill>100 баллов</sl-badge> ';
      if (benefitHas(benefits, 'баллы_ДИ')) html += '<sl-badge variant="neutral" pill>+ баллы</sl-badge> ';
      return html;
    }

    function formatDate(iso) {
      if (!iso) return '';
      try {
        var d = new Date(iso);
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch(e) { return iso; }
    }

    function daysUntil(iso) {
      if (!iso) return null;
      try {
        var now = new Date();
        var target = new Date(iso);
        return Math.floor((target - now) / (1000 * 60 * 60 * 24));
      } catch(e) { return null; }
    }

    function showToast(msg, variant) {
      variant = variant || 'primary';
      // Use Shoelace sl-alert toast if available, fallback to custom
      try {
        var alert = Object.assign(document.createElement('sl-alert'), {
          variant: variant,
          closable: true,
          duration: 3500
        });
        // Use textContent to avoid XSS, but allow simple HTML via innerHTML with esc
        alert.innerHTML = esc(msg);
        document.body.append(alert);
        // Shoelace toast() shows as stacked toast
        if (typeof alert.toast === 'function') { alert.toast(); }
        else {
          alert.style.position = 'fixed';
          alert.style.bottom = '80px';
          alert.style.left = '50%';
          alert.style.transform = 'translateX(-50%)';
          alert.style.zIndex = '200';
          setTimeout(function(){ try{ alert.hide(); }catch(e){ alert.remove(); } }, 3500);
        }
        // Also fallback custom toast if shoelace not upgraded
        setTimeout(function(){ if (!alert.toast) alert.remove(); }, 4000);
        return;
      } catch(e) {
        // Fallback DOM toast
        var el = document.getElementById('toast');
        if (el) {
          el.textContent = msg;
          el.classList.add('show');
          clearTimeout(el._t);
          el._t = setTimeout(function() { el.classList.remove('show'); }, 3500);
        }
      }
    }

    // ========== START ==========
    init();
  </script>
</body>
</html>
